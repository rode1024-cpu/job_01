name: job-alert

on:
  schedule:
    # UTC 기준. 한국시간(KST = UTC+9) 09:00, 14:00, 19:30
    - cron: "0 0 * * *"      # 09:00 KST
    - cron: "0 5 * * *"      # 14:00 KST
    - cron: "30 10 * * *"    # 19:30 KST
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write         # seen.json 저장(커밋)용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - run: python main.py
        working-directory: bot
        env:
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: save seen.json
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add bot/seen.json
          if ! git diff --staged --quiet; then
            git commit -m "update seen"
            git push
          fi
