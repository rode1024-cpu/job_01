name: probe-jobkorea

# 잡코리아 페이지 구조 점검용. Actions 탭에서 수동으로만 실행합니다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - run: mkdir -p bot/probe
      - name: dry-run (텔레그램 전송·기록 저장 없이 화면에만 출력)
        working-directory: bot
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: python main.py --dry-run 2>&1 | tee probe/dryrun.txt
      - name: save report
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add bot/probe/
          if ! git diff --staged --quiet; then
            git commit -m "probe report"
            git pull --rebase -q origin "$GITHUB_REF_NAME"
            git push
          fi
