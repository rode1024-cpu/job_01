name: probe-jobkorea

# 잡코리아 페이지 구조 점검용. Actions 탭에서 수동으로만 실행합니다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - run: python bot/probe.py
      - name: save report
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add bot/probe/report.txt
          if ! git diff --staged --quiet; then
            git commit -m "probe report"
            git pull --rebase -q origin main
            git push
          fi
