# ============================================================
# 구직 알림 조건 설정 (여기만 고치면 동작이 바뀝니다)
# ============================================================

# 검색할 키워드 (사람인 API / 잡코리아 검색창에 그대로 들어감)
search_keywords:
  - 온라인MD
  - 채널MD
  - 이커머스MD
  - 브랜드MD
  - 이커머스 MD

# 제목에 이 중 하나라도 있어야 후보로 인정 (직무 필터)
role_terms: [MD, 상품기획, 머천다이저, 머천다이징, 상품운영]
# 제목에 이게 있으면 직무 만점 (없고 role_terms만 있으면 절반)
role_strong_terms: [온라인MD, 온라인 MD, 채널MD, 채널 MD, 이커머스MD, 이커머스 MD, 브랜드MD, 브랜드 MD, 플랫폼MD]

# 경력 조건 (년)
experience: {min: 5, max: 8}

# 연봉 (만원)
salary: {preferred: 4800, strong: 5000}

# 직급 키워드 (본문에 있으면 가점)
level_terms: [과장, 차장, 대리~과장, 과장~차장, 과장급]

# 좋은 카테고리 (2개 이상 20점, 1개 10점)
good_categories: [게임, 콘솔, 닌텐도, 플레이스테이션, IT, 디지털, 전자, 가전, 생활용품, 리빙, 취미, 콘텐츠, 굿즈]

# 검토 가능 카테고리 (10점)
maybe_categories: [완구, 토이, 캐릭터, IP, 라이선스, 반려동물, 펫, 자동차용품, 카케어]

# 제외 카테고리: 제목/회사명에 있거나 본문에서 주력이면 탈락, 조금 섞인 정도면 감점
exclude_categories: [패션, 의류, 잡화, 화장품, 뷰티, 코스메틱, 식품, 푸드, 건강기능식품, 건기식]

# 좋은 업무 (3개 이상 15점, 1~2개 7.5점)
good_tasks: [채널 전략, 채널전략, 프로모션, 매출분석, 매출 분석, 수요예측, 수요 예측, 발주, 재고, 협상, 입점, 플랫폼]

# 조직/규모 긍정 힌트 (있으면 10점, 없으면 중간 점수)
org_terms: [AMD, 디자인팀, 물류팀, CS팀, 브랜드사, 총판, 유통사, 중견기업, 코스닥, 코스피, 상장]

# 조직 부정 힌트 (1개 5점, 2개 이상 0점) - 업무가 MD 밖으로 번지는 신호
org_negative_terms: [상세페이지, 촬영, CS 응대, 고객 응대, 포장, 출고, 올라운더, 1인 다역]

# 고용 형태 감점 키워드 (본문에 있으면 -10점, 알림에 "－ 고용형태(...)"로 표시)
contract_terms: [계약직, 인턴, 파견, 수습, 기간제, 프리랜서, 개월 계약, 계약 후 전환]

# ★ 내가 알림 받을 지역 (여기만 고치면 됩니다)
# 이 목록에 있는 지역 공고만 오고, 지역별로 묶여서 옵니다. 순서대로 보내요.
# 쓰는 법: 시/구를 한 줄에 하나씩. 구 이름이 겹칠 수 있으니 "서울 강서구"처럼 앞에 서울/경기/인천을 붙이세요.
# 비워두면([]) 아래 locations 규칙(전국 검색 후 출퇴근권 점수)을 대신 씁니다.
regions:
  - 경기도 부천시
  - 서울 구로구
  - 서울 금천구
  - 서울 강서구
  - 서울 강남구

# 공고에 근무지가 아예 안 적혀 있을 때: skip(알림 안 함) / send("지역 미확인"으로 따로 보냄)
unknown_region: skip

# 지역 (regions가 비어 있을 때만 사용. 주소 문자열에 포함되는지로 판단)
locations:
  primary: [부천, 강서구, 양천구, 구로구, 금천구, 영등포구, 마포구, 광명, 시흥, 김포, 인천 부평, 인천 계양]
  secondary: [동작구, 관악구, 서대문구, 은평구, 용산구, 안양, 인천 서구, 인천 남동, 고양]
  # 출퇴근이 사실상 어려운 지역: 탈락
  far: [성남, 용인, 수원, 화성, 평택, 이천, 남양주, 하남, 의정부, 부산, 대구, 대전, 광주, 울산, 세종, 제주, 강원, 충청, 충북, 충남, 전라, 경상]

# 알림 기준
notify_threshold: 55   # 이 점수 이상만 알림 (앱의 '검토 후 지원'은 50점, 여기선 애매한 공고를 더 걸러 55)
star_threshold: 70     # 이 점수 이상은 ★ 표시 (앱의 '지원 추천' 기준)
max_alerts_per_run: 5  # 지역별로 한 번에 보낼 최대 개수 (넘치면 요약 1건)
first_run_max: 3       # 처음 실행 시 지역별 상위 몇 개만

# 실행 결과 요약 메시지: daily(하루 한 번, 알림이 없어도) / quiet(수동 실행·접속 문제일 때만)
status_message: daily

# 잡코리아 상세페이지 조회 상한 (서버에 부담 주지 않도록)
jobkorea_max_detail: 15
